name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Ensure dependencies are not committed
        shell: pwsh
        run: |
          $tracked = git ls-files -- node_modules
          if ($tracked) {
            Write-Error "node_modules must not be tracked. Remove it from Git."
            exit 1
          }

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Run tests
        run: npm test
